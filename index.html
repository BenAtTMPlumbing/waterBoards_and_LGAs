<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Excel Map Link</title>
    <script src="https://mapbox.com"></script>
    <link href="https://mapbox.com" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; } 
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #error-msg { position: absolute; top: 20px; left: 20px; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.3); color: red; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="error-msg"></div>
<div id="map"></div>

<script>
    // 1. Get Lat/Lon and token parameters out of the incoming Excel URL string
    const urlParams = new URLSearchParams(window.location.search);
    const lat = parseFloat(urlParams.get('lat'));
    const lng = parseFloat(urlParams.get('lon'));
    const urlToken = urlParams.get('token');

    const errorDiv = document.getElementById('error-msg');

    // 2. Validate that the Excel file passed the token parameter string
    if (!urlToken) {
        errorDiv.innerText = "Error: No Mapbox token was passed in the URL from Excel.";
        errorDiv.style.display = "block";
    } else {
        mapboxgl.accessToken = urlToken;

        // Set fallback map configurations if coordinate parameters are missing
        const mapCenter = (!isNaN(lat) && !isNaN(lng)) ? [lng, lat] : [144.9631, -37.8136]; // Defaults to Melbourne area
        const mapZoom = (!isNaN(lat) && !isNaN(lng)) ? 15 : 9;

        try {
            // 3. Initialise your specific Mapbox Studio style layout
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/bhoward-tm-plumbing/cmpze0ws0003q01r916vv4toj', 
                center: mapCenter, 
                zoom: mapZoom
            });

            // 4. Drop the interactive marker pin if valid coordinates exist
            if (!isNaN(lat) && !isNaN(lng)) {
                new mapboxgl.Marker()
                    .setLngLat([lng, lat])
                    .addTo(map);
            }
        } catch (e) {
            errorDiv.innerText = "Mapbox Error: " + e.message;
            errorDiv.style.display = "block";
        }
    }
</script>
</body>
</html>
