<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Testing Excel Variables</title>
    <style>
        body { font-family: monospace; padding: 40px; background: #f0f0f0; font-size: 18px; line-height: 1.6; }
        .box { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ccc; max-width: 600px; }
        .success { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Excel-to-Web Variable Test</h2>
    <p><strong>Latitude:</strong> <span id="lat-val">Waiting...</span></p>
    <p><strong>Longitude:</strong> <span id="lon-val">Waiting...</span></p>
    <p><strong>Token Status:</strong> <span id="token-val">Waiting...</span></p>
</div>

<script>
    // Grab variables from URL
    const urlParams = new URLSearchParams(window.location.search);
    const lat = urlParams.get('lat');
    const lon = urlParams.get('lon');
    const token = urlParams.get('token');

    // Display Latitude
    document.getElementById('lat-val').innerHTML = lat ? lat : '<span class="fail">MISSING</span>';
    
    // Display Longitude
    document.getElementById('lon-val').innerHTML = lon ? lon : '<span class="fail">MISSING</span>';
    
    // Display Token Status safely (hiding most of it)
    if (token) {
        document.getElementById('token-val').innerHTML = `<span class="success">FOUND</span> (Starts with: ${token.substring(0, 10)}...)`;
    } else {
        document.getElementById('token-val').innerHTML = '<span class="fail">MISSING</span>';
    }
</script>

</body>
</html>
