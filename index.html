<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>T&M Plumbing - VIC Water Retailer and NSW LGA Map Viewer</title>

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">

    <!-- Mapbox Geocoder Search Bar -->
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.min.js"></script>
    <link
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.css"
        rel="stylesheet"
        type="text/css"
    >

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        #error {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            z-index: 1000;
            display: none;
            max-width: 500px;
        }
    </style>
</head>

<body>

<div id="error"></div>
<div id="map"></div>

<script>
    // ---------------------------------------------------
    // MAPBOX TOKEN
    // ---------------------------------------------------

    mapboxgl.accessToken = 'pk.eyJ1IjoiYmhvd2FyZC10bS1wbHVtYmluZyIsImEiOiJjbXB6aGF2b2IwaHZ5MnJvbnY1NXQ0eWZwIn0.X6ihykMSNjihdbP-yIbDEQ';

    // ---------------------------------------------------
    // URL PARAMETERS
    // Example:
    // ?lat=-36.38416754313632&lon=145.4301754683961
    // ---------------------------------------------------

    const params = new URLSearchParams(window.location.search);

    const lat = parseFloat(params.get('lat'));
    const lon = parseFloat(params.get('lon'));

    console.log('Latitude:', lat);
    console.log('Longitude:', lon);

    // ---------------------------------------------------
    // DEFAULT LOCATION
    // ---------------------------------------------------

    const defaultLat = -36.38416754313632;
    const defaultLon = 145.4301754683961;

    const mapLat = isNaN(lat) ? defaultLat : lat;
    const mapLon = isNaN(lon) ? defaultLon : lon;

    // ---------------------------------------------------
    // MAP
    // ---------------------------------------------------

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/bhoward-tm-plumbing/cmpze0ws0003q01r916vv4toj',
        center: [mapLon, mapLat],
        zoom: 11
    });

    // ---------------------------------------------------
    // SEARCH BAR
    // ---------------------------------------------------

    const geocoder = new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        mapboxgl: mapboxgl,
        marker: {
            color: '#FF0000'
        },
        placeholder: 'Search address',
        countries: 'au'
    });

    map.addControl(geocoder, 'top-left');

    // ---------------------------------------------------
    // INITIAL MARKER FROM URL LAT/LON
    // ---------------------------------------------------

    map.on('load', () => {

        console.log('Map Loaded');

        if (!isNaN(lat) && !isNaN(lon)) {

            new mapboxgl.Marker({
                color: '#FF0000'
            })
            .setLngLat([lon, lat])
            .addTo(map);

        }

    });

    // ---------------------------------------------------
    // ERROR HANDLING
    // ---------------------------------------------------

    map.on('error', (e) => {

        console.error(e);

        const errorDiv = document.getElementById('error');

        errorDiv.style.display = 'block';
        errorDiv.innerHTML =
            '<strong>Map Error</strong><br><br>' +
            JSON.stringify(e.error);

    });
</script>

</body>

</html>
